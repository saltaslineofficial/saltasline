<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ödeme Durumu | SALTAŞLİNE</title><link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f3ed;color:#24231f;font:15px/1.7 system-ui,Arial,sans-serif}.bar{padding:20px 7%;background:#1b211d;color:#fff;font-weight:700;letter-spacing:2px}main{max-width:580px;margin:70px auto;background:white;border-radius:14px;padding:43px 36px;border:1px solid #e9e1d5}h1{font:normal 38px Georgia,serif}p{color:#58544f}a{color:#85623c}.line{border-top:1px solid #ebe4d9;padding-top:20px}small{color:#8a8580}</style></head><body class="payment-result-page"><div class="bar">SALTAŞLİNE <button class="theme-toggle" data-theme-toggle type="button" aria-label="Karanlık moda geç" aria-pressed="false" title="Karanlık moda geç"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Karanlık mod</span></button></div><main><h1>Ödeme durumu</h1><p id="status" role="status">Ödeme sonucu güvenli sistemden doğrulanıyor…</p><p class="line">Bir siparişin ödenmiş sayılması için PayTR'ın sunucumuza gönderdiği sonucun doğrulanması gerekir. Bu ekran tek başına ödeme onayı değildir.</p><a href="index.html">Ana sayfaya dön</a><br><small id="oid"></small></main><script>
"use strict";const PAYMENT_API_BASE = ""; // Worker adresi kurulumda eklenecek
const query=new URLSearchParams(location.search),oid=query.get("oid")||"",receipt=query.get("receipt")||"";
const status=document.getElementById("status"),orderNumber=document.getElementById("oid");
if(/^[A-Za-z0-9]{10,64}$/.test(oid))orderNumber.textContent="Sipariş no: "+oid;
const messages={paid:"Ödeme PayTR bildirimiyle doğrulandı. Siparişiniz alınmıştır.",failed:"Ödeme başarılı olmadı. Yeniden deneyebilir veya bize ulaşabilirsiniz.",pending:"Ödeme sonucu bekleniyor; henüz onaylanmadı.",init_failed:"Ödeme başlatılamadı. Sipariş için tahsilat onaylanmadı."};
if(!PAYMENT_API_BASE){status.textContent="Ödeme durumu servisi henüz etkin değil."; }
else if(!/^[a-f0-9]{32}$/.test(receipt)||!/^[A-Za-z0-9]{10,64}$/.test(oid)){status.textContent="Sipariş bilgileri eksik."; }
else{
  let checks=0;
  async function check(){
    checks++;
    try{
      const url=new URL("/api/payment/status/"+encodeURIComponent(oid),PAYMENT_API_BASE);
      url.searchParams.set("receipt",receipt);
      const res=await fetch(url,{mode:"cors",cache:"no-store"});
      const data=await res.json();
      if(!res.ok)throw Error("Sorgulanamadı");
      status.textContent=messages[data.status]||"Ödeme sonucu henüz doğrulanmadı.";
      if(["pending"].includes(data.status)&&checks<12)setTimeout(check,5000);
    }catch{status.textContent="Ödeme sonucu şu anda sorgulanamıyor. Tahsilat durumunu satıcıyla teyit ediniz.";}
  }
  check();
}
</script></body></html>
